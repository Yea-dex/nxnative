name: Build iOS IPA

on:
  workflow_dispatch: # Manuel olarak butona basıp başlatabilmek için

jobs:
  build:
    runs-on: macos-latest # macOS Sequoia / Sonoma sunucularını kullanır

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Alt modülleri eksiksiz çeker

      - name: Bağımlılıkları Kur (Homebrew & CMake)
        run: |
          brew install cmake ninja python@3.12
          pip3 install --break-system-packages setuptools

      - name: Xcode Komut Satırı Araçlarını Ayarla
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Projeyi CMake ve Ninja ile Derle
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=../cmake/ios.toolchain.cmake -DPLATFORM=OS64
          ninja

      - name: IPA Paketini Hazırla
        run: |
          mkdir -p Payload/nxnative.app
          # Derlenen binary dosyasını Payload içine taşıma komutları
          # (Not: Projenizin ana yapısına göre binary adı değişebilir, derlenen çıktı kopyalanır)
          cp build/nxnative Payload/nxnative.app/
          zip -r nxnative.ipa Payload

      - name: IPA Dosyasını Artifact Olarak Yükle
        uses: actions/artifacts@v4
        with:
          name: nxnative-ipad-app
          path: nxnative.ipa
